org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Configurable Cloudflare Worker base URL (override in local.properties or in-app server settings)
SYSTEM_UTILITY_DEFAULT_BASE_URL=https://system-utility-backend.avrodipff.workers.dev

# GitHub Releases repository (`owner/repo`) for in-app auto-updates (also editable inside Settings -> App Updates)
SYSTEM_UTILITY_GITHUB_REPO=Hack3rAv/Arpii-Chat-app

# Release versioning (overridden automatically in CI by Git tag)
SYSTEM_UTILITY_VERSION_NAME=1.0.0
SYSTEM_UTILITY_VERSION_CODE=10000
