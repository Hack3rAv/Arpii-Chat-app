# DEPRECATED / UNUSED IN CURRENT RELEASE:
# Replaced by Cloudflare Realtime TURN (`CF_TURN_KEY_ID` + `CF_TURN_API_TOKEN` in Worker secrets).
# Retained only as historical self-hosted reference; do not deploy alongside Cloudflare Realtime TURN.
#
# Self-hosted coturn TURN server configuration for System Utility WebRTC calling.
# Replace realm, external-ip, and static-auth-secret in production deployment.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SHARED_SECRET_MATCHING_CLOUDFLARE_ENV
realm=turn.example.com

# Ephemeral relay port range
min-port=49152
max-port=65535

# Restrict abuse: prevent relaying to loopback/private metadata endpoints
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logging (non-PII operational logs)
simple-log
no-stdout-log
syslog
